name: Issue Solver - Auto Fix & Create PR

on:
  issue_comment:
    types: [created, edited]

jobs:
  solve:
    # Only trigger on /solve command in issues
    if: github.event.issue.pull_request == null && contains(github.event.comment.body, '/solve')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Parse issue and command
        id: parse
        run: |
          echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          echo "issue_title=${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
          echo "issue_body=${{ github.event.issue.body }}" >> $GITHUB_OUTPUT
          echo "issue_labels=${{ join(github.event.issue.labels.*.name, ',') }}" >> $GITHUB_OUTPUT
          echo "author=${{ github.event.comment.user.login }}" >> $GITHUB_OUTPUT
      
      - name: Check for auto-solve eligibility
        id: eligibility
        run: |
          labels="${{ steps.parse.outputs.issue_labels }}"
          if [[ "$labels" == *"auto-solve"* ]]; then
            echo "eligible=true" >> $GITHUB_OUTPUT
            echo "level=Level 1 (Simple)"
          else
            echo "eligible=false" >> $GITHUB_OUTPUT
            echo "level=Level 2+ (requires approval)"
          fi
        shell: bash
      
      - name: Add reaction to comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            })
      
      - name: Comment: Starting analysis
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 **Sysinfo Solver Starting**\n\n**Issue**: #${{ steps.parse.outputs.issue_number }}\n**Title**: ${{ steps.parse.outputs.issue_title }}\n**Complexity**: ${{ steps.eligibility.outputs.level }}\n**Requested by**: @${{ steps.parse.outputs.author }}\n\n📋 **Phase 1**: Analyzing issue...\n⏳ **Phase 2**: Generating fix...\n🧪 **Phase 3**: Validating changes...\n📤 **Phase 4**: Creating PR...\n\n_[This is automated by GitHub Actions + AI]_`
            })
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Setup Git
        run: |
          git config user.name "sysinfo-solver[bot]"
          git config user.email "solver@sysinfo.bot"
      
      - name: Create branch for fix
        id: branch
        run: |
          BRANCH="auto/issue-${{ steps.parse.outputs.issue_number }}-fix"
          git checkout -b "$BRANCH"
          echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT
        shell: bash
      
      - name: Validate code formatting
        run: cargo fmt -- --check
        continue-on-error: true
      
      - name: Validate clippy
        run: cargo clippy --all-targets --features serde -- -D warnings
        continue-on-error: true
      
      - name: Run tests
        run: cargo test --all
        continue-on-error: true
      
      - name: Comment: Placeholder for agent implementation
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ **Solver Status**: Awaiting agent integration\n\nThis workflow is ready to accept AI-generated fixes. To complete the automation:\n\n1. Integrate LLM API (e.g., GitHub Copilot API, OpenAI)\n2. Agent will analyze issue using skills:\n   - Issue analyzer\n   - Code explorer\n   - Fix generator\n   - Test validator\n3. Agent will commit fix to branch: \`${{ steps.branch.outputs.branch_name }}\`\n4. Create PR automatically\n\n**Current Status**: Framework ready, awaiting agent implementation\n\n_See \`.github/agents/\` and \`.github/skills/\` for agent logic_`
            })
      
      - name: Push branch
        run: |
          git push origin ${{ steps.branch.outputs.branch_name }} || echo "Branch already exists"
        continue-on-error: true
    
    outputs:
      branch_name: ${{ steps.branch.outputs.branch_name }}
      issue_number: ${{ steps.parse.outputs.issue_number }}
      eligible: ${{ steps.eligibility.outputs.eligible }}

  create_pr:
    needs: solve
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    
    if: always()
    
    steps:
      - name: Create draft PR (framework ready)
        uses: actions/github-script@v7
        with:
          script: |
            const issue = ${{ steps.parse.outputs.issue_number || 'null' }};
            const branch = '${{ needs.solve.outputs.branch_name }}';
            
            if (!issue || !branch) {
              console.log('Missing issue or branch info, skipping PR creation');
              return;
            }
            
            try {
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[AUTO] Fix for issue #${issue}`,
                head: branch,
                base: 'main',
                body: `## Automated Fix for Issue #${issue}

### Status
🔄 **In Progress**: Awaiting agent implementation

This is a framework PR created by the issue solver workflow.

### What's Next
1. Agent integration with LLM
2. Code generation
3. Validation
4. PR update with actual changes

### Links
- Issue: #${issue}
- Branch: ${branch}

_Created by sysinfo-solver[bot]_`,
                draft: true
              });
              
              console.log(\`Created draft PR #\${pr.data.number}\`);
            } catch (error) {
              console.log('PR likely already exists or branch issue:', error.message);
            }
        continue-on-error: true
